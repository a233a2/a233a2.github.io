<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1120" viewBox="0 0 1760 1120" role="img" aria-labelledby="title desc">
  <title id="title">频率响应分析的闭环注入原理与适用边界</title>
  <desc id="desc">闭环系统中注入扫频信号并采集实际输入与输出，旁列适用和慎用条件的通用示意图。</desc>
  <defs>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#145A4A"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#C28B2C"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#253238" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 48px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #233138; }
      .subtitle { font: 400 23px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #5A666B; }
      .label { font: 600 24px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #233138; }
      .small { font: 400 20px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #536067; }
      .tiny { font: 400 18px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #667278; }
      .block-title { font: 700 28px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #FFFFFF; }
      .block-note { font: 400 18px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #E4F1EC; }
      .card-title { font: 700 30px "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .card-text { font: 400 21px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #344148; }
      .pill { font: 700 19px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #FFFFFF; }
      .math { font: 600 22px "Consolas", "Noto Sans SC", monospace; fill: #1F3932; }
    </style>
  </defs>

  <rect width="1760" height="1120" fill="#F6F5EF"/>
  <rect x="0" y="0" width="1760" height="14" fill="#145A4A"/>

  <text id="title-text" x="90" y="82" class="title">频率响应分析：在闭环里“问”系统</text>
  <text x="92" y="123" class="subtitle">用已知激励观察各频率下的幅值与相位变化，同时保留闭环保护与工作状态</text>
  <rect x="1410" y="55" width="270" height="46" rx="23" fill="#E8D6AE"/>
  <text x="1545" y="86" text-anchor="middle" class="small" fill="#765719">通用示意 · 不对应具体设备</text>

  <!-- Closed-loop principle panel -->
  <rect x="70" y="165" width="1620" height="460" rx="28" fill="#FFFFFF" stroke="#DCE2DF" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="216" class="label">闭环注入与测量关系</text>
  <text x="110" y="250" class="small">注入信号 d 不等同于对象实际收到的输入；辨识时应同步记录 u 与 y</text>

  <!-- reference -->
  <text x="115" y="352" class="label">参考 r</text>
  <line x1="195" y1="343" x2="258" y2="343" stroke="#145A4A" stroke-width="5" marker-end="url(#arrow-green)"/>
  <circle cx="292" cy="343" r="31" fill="#F7FAF8" stroke="#145A4A" stroke-width="4"/>
  <text x="292" y="352" text-anchor="middle" class="label">Σ</text>
  <text x="278" y="313" class="small">+</text>
  <text x="278" y="388" class="small">−</text>

  <!-- Controller C -->
  <line x1="323" y1="343" x2="376" y2="343" stroke="#145A4A" stroke-width="5" marker-end="url(#arrow-green)"/>
  <rect x="390" y="288" width="210" height="110" rx="18" fill="#145A4A"/>
  <text x="495" y="337" text-anchor="middle" class="block-title">控制器 C</text>
  <text x="495" y="371" text-anchor="middle" class="block-note">保持系统工作状态</text>

  <!-- injection point -->
  <line x1="600" y1="343" x2="677" y2="343" stroke="#145A4A" stroke-width="5" marker-end="url(#arrow-green)"/>
  <circle cx="712" cy="343" r="31" fill="#FFF9EC" stroke="#C28B2C" stroke-width="4"/>
  <text x="712" y="352" text-anchor="middle" class="label">Σ</text>
  <text x="698" y="313" class="small">+</text>
  <text x="664" y="352" class="small">+</text>
  <line x1="712" y1="238" x2="712" y2="300" stroke="#C28B2C" stroke-width="5" marker-end="url(#arrow-gold)"/>
  <rect x="633" y="190" width="158" height="45" rx="22" fill="#C28B2C"/>
  <text x="712" y="220" text-anchor="middle" class="pill">扫频注入 d</text>

  <!-- actual input u and plant -->
  <line x1="743" y1="343" x2="856" y2="343" stroke="#145A4A" stroke-width="5" marker-end="url(#arrow-green)"/>
  <circle cx="800" cy="343" r="7" fill="#C28B2C"/>
  <text x="800" y="318" text-anchor="middle" class="label" fill="#9B6B1E">实际输入 u</text>
  <rect x="872" y="288" width="250" height="110" rx="18" fill="#26373D"/>
  <text x="997" y="337" text-anchor="middle" class="block-title">被控对象 P</text>
  <text x="997" y="371" text-anchor="middle" class="block-note">待观察的动态环节</text>

  <!-- output -->
  <line x1="1122" y1="343" x2="1275" y2="343" stroke="#145A4A" stroke-width="5" marker-end="url(#arrow-green)"/>
  <circle cx="1205" cy="343" r="7" fill="#C28B2C"/>
  <text x="1205" y="318" text-anchor="middle" class="label" fill="#9B6B1E">输出 y</text>
  <rect x="1290" y="303" width="275" height="80" rx="16" fill="#EEF3F1" stroke="#91A49D" stroke-width="2"/>
  <text x="1427" y="337" text-anchor="middle" class="label">同步采集 u、y</text>
  <text x="1427" y="366" text-anchor="middle" class="tiny">时间戳与采样周期一致</text>

  <!-- H feedback -->
  <path d="M1205 350 L1205 508 L855 508" fill="none" stroke="#637078" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="635" y="458" width="220" height="100" rx="18" fill="#6C777C"/>
  <text x="745" y="501" text-anchor="middle" class="block-title">测量环节 H</text>
  <text x="745" y="532" text-anchor="middle" class="block-note">传感 / 滤波 / 延迟</text>
  <path d="M635 508 L292 508 L292 375" fill="none" stroke="#637078" stroke-width="4" marker-end="url(#arrow-green)"/>

  <rect x="930" y="455" width="555" height="112" rx="18" fill="#EEF6F2" stroke="#B8CEC5" stroke-width="2"/>
  <text x="960" y="493" class="math">Ĝ(jω) ≈ Y(jω) / U(jω)</text>
  <text x="960" y="530" class="small">核心：用实际输入 u 作为参考，避免把注入量 d 误当成对象输入</text>

  <!-- Applicability cards -->
  <rect x="70" y="665" width="790" height="365" rx="28" fill="#EEF6F2" stroke="#BDD3C9" stroke-width="2"/>
  <rect x="100" y="695" width="145" height="42" rx="21" fill="#145A4A"/>
  <text x="172" y="724" text-anchor="middle" class="pill">较适合辨识</text>
  <text x="110" y="783" class="card-title" fill="#145A4A">动态可重复、可控、可观测</text>

  <circle cx="128" cy="834" r="8" fill="#C28B2C"/>
  <text x="152" y="842" class="card-text">主要动态在测试时段内近似线性、时不变</text>
  <circle cx="128" cy="882" r="8" fill="#C28B2C"/>
  <text x="152" y="890" class="card-text">能够安全注入小扰动，并同时采到输入与输出</text>
  <circle cx="128" cy="930" r="8" fill="#C28B2C"/>
  <text x="152" y="938" class="card-text">工作点、负载和边界条件可以记录并复现</text>
  <circle cx="128" cy="978" r="8" fill="#C28B2C"/>
  <text x="152" y="986" class="card-text">信噪比足够，目标频段内存在可用响应</text>

  <rect x="900" y="665" width="790" height="365" rx="28" fill="#FCF6E9" stroke="#DFC99D" stroke-width="2"/>
  <rect x="930" y="695" width="145" height="42" rx="21" fill="#C28B2C"/>
  <text x="1002" y="724" text-anchor="middle" class="pill">应慎用 / 分段</text>
  <text x="940" y="783" class="card-title" fill="#8B621E">强非线性、强时变或难以安全激励</text>

  <circle cx="958" cy="834" r="8" fill="#145A4A"/>
  <text x="982" y="842" class="card-text">明显饱和、死区、间隙、摩擦跳变等非线性</text>
  <circle cx="958" cy="882" r="8" fill="#145A4A"/>
  <text x="982" y="890" class="card-text">测试期间工况快速漂移，动态不可重复</text>
  <circle cx="958" cy="930" r="8" fill="#145A4A"/>
  <text x="982" y="938" class="card-text">共振风险未知，或激励可能触发保护 / 损伤</text>
  <circle cx="958" cy="978" r="8" fill="#145A4A"/>
  <text x="982" y="986" class="card-text">只能采到闭环外部信号，关键通道不可观测</text>

  <text x="90" y="1083" class="tiny">边界原则：先小幅、窄频、短时验证，再逐步扩展；频响描述的是“指定工作点附近”的动态。</text>
</svg>
